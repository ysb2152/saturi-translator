    <line x1="226" y1="124" x2="251" y2="124" stroke="#8A7C68" stroke-width="1.6" marker-end="url(#arw)"/>
    <line x1="435" y1="124" x2="460" y2="124" stroke="#8A7C68" stroke-width="1.6" marker-end="url(#arw)"/>
    <line x1="644" y1="124" x2="669" y2="124" stroke="#8A7C68" stroke-width="1.6" marker-end="url(#arw)"/>
  </g>


    <line x1="196" y1="333" x2="222" y2="333" stroke="#8A7C68" stroke-width="1.6" marker-end="url(#arw)"/>
    <line x1="354" y1="333" x2="380" y2="333" stroke="#8A7C68" stroke-width="1.6" marker-end="url(#arw)"/>
    <line x1="512" y1="333" x2="538" y2="333" stroke="#8A7C68" stroke-width="1.6" marker-end="url(#arw)"/>

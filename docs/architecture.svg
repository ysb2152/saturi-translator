  <!-- 예시 -->
  <text x="450" y="410" text-anchor="middle" font-size="13" fill="#2E251B">예) "이거 억수로 맛있다" &#8594; "이거 <tspan font-weight="700" fill="#215249">대단히</tspan> 맛있다"  ·  처리 7~8초</text>

  <!-- 강조 배너 -->
  <rect x="200" y="436" width="500" height="34" rx="17" fill="#E4EDE9"/>
